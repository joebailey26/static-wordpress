name: Release

on:
  # Pushes to other branches publish x.y.z-next-<sha> prereleases under the next tag, so site branches can install unreleased changes.
  push:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@joebailey26'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish prerelease
        if: github.ref != 'refs/heads/master'
        run: |
          for dir in packages/*; do
            (
              cd "$dir"
              version="$(node -p "require('./package.json').version")-next-${GITHUB_SHA::7}"
              name="$(node -p "require('./package.json').name")"
              # A re-run for the same commit has nothing new to publish.
              if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version already published"; exit 0; fi
              npm version "$version" --no-git-tag-version && pnpm publish --tag next --no-git-checks
            )
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Version or publish
        if: github.ref == 'refs/heads/master'
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
